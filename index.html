<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasindu TV - Welcome</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Profile Logo & Welcome Screen Fireworks Styles */
        .logo-container {
            position: relative;
            padding: 4px;
            background: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8);
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            display: inline-block;
        }

        .logo-container img {
            display: block;
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 8px;
            position: relative;
            z-index: 2;
        }

        /* Welcome Screen Big Profile Logo Styles */
        .welcome-logo-container {
            position: relative;
            padding: 8px;
            background: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8);
            border-radius: 24px;
            box-shadow: 0 0 35px rgba(255, 0, 127, 0.6);
            display: inline-block;
        }

        .welcome-logo-container img {
            display: block;
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 18px;
            position: relative;
            z-index: 2;
        }

        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            animation: explode 0.8s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans min-h-screen">

    <!-- Welcome Overlay Screen -->
    <div id="welcome-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center text-center px-4 bg-gradient-to-br from-blue-900 via-sky-950 to-slate-950 transition-opacity duration-500">
        <div class="relative z-20 flex flex-col items-center max-w-2xl">
            
            <!-- Welcome Screen Profile Photo with Fireworks Border -->
            <div class="welcome-logo-container mb-6" id="welcome-logo-frame">
                <img src="678925162_122123155977167027_6693861555150019422_n-removebg-preview.png" alt="Hasindu TV Welcome Photo">
            </div>

            <!-- Welcome Heading -->
            <h1 class="text-4xl md:text-6xl font-black mb-8 tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-amber-300 to-yellow-500 drop-shadow-[0_5px_15px_rgba(234,179,8,0.5)] animate-pulse">
                Welcome Hasindu TV
            </h1>
            
            <!-- White Box with Go to Home Page Button -->
            <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-sm w-full border border-sky-400/50">
                <button onclick="enterSite()" class="w-full bg-black text-white font-bold py-3.5 px-6 rounded-xl hover:bg-gray-800 transition duration-300 text-lg shadow-md cursor-pointer flex items-center justify-center gap-2">
                    <span>Go to Home Page</span>
                    <i class="fa-solid fa-arrow-right text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Website Content (Hidden initially until button is clicked) -->
    <div id="main-content" class="hidden min-h-screen flex flex-col">
        <!-- Navbar -->
        <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex justify-between items-center sticky top-0 z-40 shadow-md">
            <div class="flex items-center space-x-3">
                <!-- Navbar Profile Logo -->
                <div class="logo-container" id="nav-logo-frame">
                    <img src="678925162_122123155977167027_6693861555150019422_n-removebg-preview.png" alt="Hasindu TV Logo">
                </div>
                <span class="text-2xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-orange-400">
                    Hasindu TV
                </span>
            </div>
            <div class="flex items-center space-x-2 bg-red-600/20 border border-red-500/30 px-3 py-1.5 rounded-full">
                <span class="w-3 h-3 bg-red-600 rounded-full animate-ping"></span>
                <span class="text-red-400 text-sm font-semibold uppercase tracking-wider">LIVE ON AIR</span>
            </div>
        </nav>

        <!-- Main Container -->
        <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8 flex-grow w-full">
            
            <!-- Left & Center: Live Stream Player (2 Columns) -->
            <div class="lg:col-span-2 space-y-6">
                <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-2xl">
                    <div class="relative aspect-video bg-black flex items-center justify-center">
                        <!-- YouTube Live Stream Embed Link -->
                        <iframe class="w-full h-full absolute inset-0" src="https://www.youtube.com/embed/live_stream?channel=YOUR_CHANNEL_ID" title="Hasindu TV Live" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                    </div>
                    <div class="p-6">
                        <h2 class="text-2xl font-bold mb-2">Hasindu TV Official Live Broadcast</h2>
                        <p class="text-gray-400 text-sm">Welcome to the official streaming channel of Hasindu TV. Enjoy the live broadcast and recent videos!</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Video Gallery / Playlist -->
            <div class="space-y-6">
                <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 shadow-xl">
                    <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-photo-film text-red-500"></i> Recent Broadcasts
                    </h3>
                    <div class="space-y-4">
                        <!-- Video Item 1 -->
                        <div class="bg-gray-950 border border-gray-800/80 rounded-xl p-3 flex gap-3 items-center hover:border-red-500/50 transition cursor-pointer">
                            <div class="w-24 h-16 bg-gray-800 rounded-lg flex items-center justify-center shrink-0 relative overflow-hidden">
                                <i class="fa-solid fa-play text-red-500"></i>
                            </div>
                            <div>
                                <h4 class="font-semibold text-sm">Hasindu TV - Stream Highlights #1</h4>
                                <span class="text-xs text-gray-500">Official Upload</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="text-center py-6 text-gray-500 text-sm border-t border-gray-900 mt-12">
            &copy; 2026 Hasindu TV. All rights reserved.
        </footer>
    </div>

    <!-- JavaScript for Welcome screen & Fireworks Animations -->
    <script>
        function enterSite() {
            const welcomeScreen = document.getElementById('welcome-screen');
            const mainContent = document.getElementById('main-content');
            
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                mainContent.classList.remove('hidden');
            }, 500);
        }

        // Generic Firework Creator Function
        function createFirework(frameElement, particleCount, distanceMax) {
            if (!frameElement) return;
            const rect = frameElement.getBoundingClientRect();
            const edge = Math.floor(Math.random() * 4);
            let startX, startY;

            if (edge === 0) { startX = Math.random() * rect.width; startY = 0; }
            else if (edge === 1) { startX = Math.random() * rect.width; startY = rect.height; }
            else if (edge === 2) { startX = 0; startY = Math.random() * rect.height; }
            else { startX = rect.width; startY = Math.random() * rect.height; }

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('firework');
                
                const colors = ['#ff0055', '#ffcc00', '#00ffcc', '#ff66ff', '#ffffff'];
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = startX + 'px';
                particle.style.top = startY + 'px';

                const angle = Math.random() * Math.PI * 2;
                const distance = 20 + Math.random() * distanceMax;
                particle.style.setProperty('--x', (Math.cos(angle) * distance) + 'px');
                particle.style.setProperty('--y', (Math.sin(angle) * distance) + 'px');

                frameElement.appendChild(particle);
                setTimeout(() => particle.remove(), 800);
            }
        }

        // Welcome Screen Logo Fireworks
        const welcomeLogoFrame = document.getElementById('welcome-logo-frame');
        setInterval(() => {
            createFirework(welcomeLogoFrame, 12, 50);
        }, 500);

        // Navbar Logo Fireworks
        const navLogoFrame = document.getElementById('nav-logo-frame');
        setInterval(() => {
            createFirework(navLogoFrame, 8, 30);
        }, 600);
    </script>

</body>
</html>
