<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasindu TV - නිල ඩෑෂ්බෝඩ් එක</title>
    <style>
        body {
            margin: 0;
            background-color: #0f1015;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Ticker එක සඳහා CSS */
        .news-ticker {
            width: 100%;
            overflow: hidden;
            background: #1a1b22;
            color: #ffffff;
            padding: 12px 0;
            white-space: nowrap;
            box-sizing: border-box;
            border-top: 2px solid #e50914;
            border-bottom: 2px solid #e50914;
        }

        .ticker-content {
            display: inline-block;
            padding-left: 100%; /* පිටුවට ඇතුළුවන මොහොතේ සිටම දකුණු කෙළවරින්ම පටන් ගැනීමට */
            animation: ticker 18s linear infinite;
        }

        .ticker-content span {
            display: inline-block;
            padding-right: 60px;
            font-size: 16px;
            font-weight: 500;
        }

        .highlight {
            color: #ff3333;
            font-weight: bold;
        }

        @keyframes ticker {
            0% {
                transform: translate3d(0, 0, 0);
            }
            100% {
                transform: translate3d(-100%, 0, 0);
            }
        }
    </style>
</head>
<body>

    <!-- දකුණේ සිට වමට ගමන් කරන Ticker කොටස -->
    <div class="news-ticker">
        <div class="ticker-content">
            <span>ඉන්ධන මිල අහස උඩට...</span>
            <span>•</span>
            <span>Hasindu TV නවතම පුවත් සමඟ රැඳී සිටින්න...</span>
            <span>•</span>
            <span class="highlight">Hasindu TV සජීවී විකාශය ලගදිම බලාපොරොත්තු වන්න!</span>
            <span>•</span>
            <span>අපගේ යූ ටියුබ් නාලිකාව සමඟද රැඳී සිටින්න.</span>
        </div>
    </div>

</body>
</html>
