<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <title>Hasindu TV - Profile Logo</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #050814;
            overflow: hidden;
        }

        .photo-container {
            position: relative;
            padding: 12px;
            background: linear-gradient(135deg, #ff007f, #7928ca, #00dfd8);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.5);
        }

        .photo-container img {
            display: block;
            width: 300px;
            height: auto;
            border-radius: 14px;
            position: relative;
            z-index: 2;
        }

        /* ගිනිකෙළි මූලික කැබලි (Fireworks Particles) */
        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
            animation: explode 0.8s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="photo-container" id="frame">
        <!-- මෙතැනට ඔයාගේ ෆොටෝ එකේ නම හරියටම තියෙන්න ඕන -->
        <img src="678925162_122123155977167027_6693861555150019422_n-removebg-preview.png" alt="Hasindu TV Profile">
    </div>

    <script>
        const frame = document.getElementById('frame');

        function createFirework() {
            const rect = frame.getBoundingClientRect();
            
            // රාමුව වටා අහඹු තැනක ගිනිකෙළි ඇතිවීම
            const edge = Math.floor(Math.random() * 4);
            let startX, startY;

            if (edge === 0) { // උඩ ප්‍රදේශය
                startX = Math.random() * rect.width;
                startY = 0;
            } else if (edge === 1) { // යට ප්‍රදේශය
                startX = Math.random() * rect.width;
                startY = rect.height;
            } else if (edge === 2) { // වම් පැත්ත
                startX = 0;
                startY = Math.random() * rect.height;
            } else { // දකුණු පැත්ත
                startX = rect.width;
                startY = Math.random() * rect.height;
            }

            // කුඩා අංශු කිහිපයක් එකවර විහිදීම
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.classList.add('firework');
                
                // වර්ණ අහඹු ලෙස මාරු වීම
                const colors = ['#ff0055', '#ffcc00', '#00ffcc', '#ff66ff', '#ffffff'];
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                particle.style.left = startX + 'px';
                particle.style.top = startY + 'px';

                // විහිදී යන දිශාව (Angle සහ Distance)
                const angle = Math.random() * Math.PI * 2;
                const distance = 40 + Math.random() * 60;
                const destinationX = Math.cos(angle) * distance;
                const destinationY = Math.sin(angle) * distance;

                particle.style.setProperty('--x', destinationX + 'px');
                particle.style.setProperty('--y', destinationY + 'px');

                frame.appendChild(particle);

                // සජීවීකරණය අවසන් වූ පසු අංශු ඉවත් කිරීම
                setTimeout(() => {
                    particle.remove();
                }, 800);
            }
        }

        // නිතර නිතර ගිනිකෙළි ඇතිවන වාර ගණන
        setInterval(createFirework, 400);
    </script>

</body>
</html>
